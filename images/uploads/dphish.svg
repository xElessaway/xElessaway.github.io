<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">dPhish cover banner</title>
  <desc id="desc">Dark blue phishing-themed cover art featuring a cyan hook and mail icon with the text Maximize your return and dPhish.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
