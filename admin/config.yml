backend:
  name: github
  repo: xElessaway/xElessaway.github.io
  branch: main
  base_url: https://github.com
  auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Research & Writeups"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Short Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "publishedAt", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Section Lane"
        name: "archiveSection"
        widget: "select"
        options: ["reports", "writeups"]
        default: "reports"
      - { label: "Tags", name: "tags", widget: "list", default: ["investigation"] }
      - { label: "Cover Image URL", name: "cover", widget: "string", required: false }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false }
      - { label: "Draft State", name: "draft", widget: "boolean", default: false }
      - { label: "Original Source Label", name: "sourceLabel", widget: "string", required: false, default: "Medium" }
      - { label: "Original Source URL", name: "sourceUrl", widget: "string", required: false }
      - { label: "Article Body", name: "body", widget: "markdown" }

  - name: "ctfChallenges"
    label: "CTF Challenges"
    folder: "src/content/ctfChallenges"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Collection Slug", name: "collection", widget: "string" }
      - { label: "Difficulty", name: "difficulty", widget: "select", options: ["easy", "medium", "hard"] }
      - { label: "Mission Prompt", name: "prompt", widget: "text" }
      - { label: "Flag / Password Format", name: "passwordFormat", widget: "string", default: "flag{...}" }
      - { label: "Hint", name: "hint", widget: "string", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int" }
      - { label: "Answer SHA256 Hashes", name: "answerHashes", widget: "list" }
      - { label: "Challenge Image URL", name: "image", widget: "string", required: false }

  - name: "actors"
    label: "Threat Actor Dossiers"
    folder: "src/content/actors"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Actor Name", name: "name", widget: "string" }
      - { label: "Aliases", name: "aliases", widget: "list" }
      - { label: "Tracking Status", name: "status", widget: "select", options: ["active", "tracking", "disrupted", "historic"] }
      - { label: "Country / Origin", name: "origin", widget: "string" }
      - { label: "Primary Motivation", name: "motivation", widget: "string" }
      - { label: "Observed Targets", name: "targets", widget: "list" }
      - { label: "First Seen", name: "firstSeen", widget: "string" }
      - { label: "Last Seen", name: "lastSeen", widget: "string" }
      - { label: "Custom Tooling", name: "tools", widget: "list" }
      - { label: "TTPs & MITRE", name: "ttps", widget: "list" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Featured Dossier", name: "featured", widget: "boolean", default: false }
      - { label: "Executive Summary & Analysis", name: "body", widget: "markdown" }
